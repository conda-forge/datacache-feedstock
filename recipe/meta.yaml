{% set name = "datacache" %}
{% set version = "1.10.1" %}
{% set sha256 = "b56d1f548756c20d0c92e8aa53441913558fde710d0211386e0fbbc3f980494a" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=64
  run:
    - python >={{ python_min }}
    - pandas >=0.15.2
    - appdirs >=1.4.0
    - requests >=2.5.1
    - typechecks >=0.0.2

test:
  source_files:
    - tests
    - examples
  requires:
    - python {{ python_min }}
    - pip
    - pytest >=7
    - tqdm >=4.64
    - lxml >=4.9
  imports:
    - datacache
  commands:
    - python -m pip check
    - python -m pytest tests -q
    - python -m examples.basic_usage

about:
  home: https://github.com/openvax/datacache
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: 'Helpers for transparently downloading datasets'

extra:
  recipe-maintainers:
    - npavlovikj
